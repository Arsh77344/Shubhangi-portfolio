# Rebuilds index.html automatically whenever you change something in /src.
# (You can skip this and run `python3 build.py` yourself instead.)
# Publishing is handled by GitHub Pages serving index.html from the main branch
# --- see "Publish on GitHub Pages" in README.md.
name: Rebuild index.html
on:
  push:
    branches: [main]
    paths: ['src/**', 'build.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 build.py
      - name: Commit the rebuilt index.html
        run: |
          if [ -n "$(git status --porcelain index.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Rebuild index.html"
            git push
          fi
