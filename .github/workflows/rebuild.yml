# Rebuilds index.html automatically whenever you change something in /src.
# (You can skip this and run `python3 build.py` yourself instead.)
# Publishing is handled by GitHub Pages serving index.html from the main branch
# --- see "Publish on GitHub Pages" in README.md.
name: Rebuild index.html
on:
  push:
    branches: [main]
    paths: ['src/**', 'build.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 build.py
      - name: Commit the rebuilt page and its assets
        run: |
          # index.html references each image with a hash of its contents, so
          # the two have to be committed together or a changed photograph
          # leaves the page asking for a file that is not there.
          if [ -n "$(git status --porcelain index.html assets og-card.png robots.txt sitemap.xml)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html assets og-card.png robots.txt sitemap.xml
            git commit -m "Rebuild index.html, assets and crawl files"
            git push
          fi
